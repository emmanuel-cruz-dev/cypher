<section class="relative dark:bg-[#0d1117] pt-8 pb-16 px-8 overflow-hidden">
  <div class="absolute inset-0 pointer-events-none">
    <svg
      class="w-full h-full opacity-10 text-black dark:text-white"
      xmlns="http://www.w3.org/2000/svg"
    >
      <line x1="0%" y1="10%" x2="30%" y2="100%" class="stroke-current" stroke-width="0.5" />
      <line x1="0%" y1="40%" x2="20%" y2="100%" class="stroke-current" stroke-width="0.5" />
    </svg>
  </div>

  <div class="relative z-10 max-w-6xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-7 gap-12 lg:gap-20 items-center">
      <div class="lg:col-span-4 flex flex-col gap-6">
        <header>
          <p
            ngmMotion
            [initial]="{ opacity: 0, }"
            [whileInView]="{ opacity:1, }"
            [viewport]="{ once: true, amount: 0.5 }"
            [transition]="{ duration: 0.6 }"
            class="flex items-center gap-2 text-sm font-semibold tracking-[0.2em] text-gray-400 uppercase mb-3"
          >
            <span
              class="inline-block w-2 h-2 rounded-full"
              [ngClass]="accent.replace('text-', 'bg-')"
            ></span>
            {{ prefix + '.tagline' | translate }}
          </p>

          <h1
            ngmMotion
            [initial]="{ opacity: 0, y: 20 }"
            [whileInView]="{ opacity: 1, y: 0 }"
            [viewport]="{ once: true }"
            [transition]="{ duration: 0.6, delay: 0.1 }"
            class="text-4xl md:text-5xl font-bold leading-tight"
          >
            {{ prefix + '.title' | translate }}
          </h1>
        </header>

        <p
          ngmMotion
          [initial]="{ opacity: 0, y: 16 }"
          [whileInView]="{ opacity: 1, y: 0 }"
          [viewport]="{ once: true }"
          [transition]="{ duration: 0.6, delay: 0.2 }"
          class="text-base text-gray-500 dark:text-gray-400 leading-relaxed max-w-xl"
        >
          {{ prefix + '.description' | translate }}
        </p>

        <div
          ngmMotion
          [initial]="{ opacity: 0, y: 16 }"
          [whileInView]="{ opacity: 1, y: 0 }"
          [viewport]="{ once: true }"
          [transition]="{ duration: 0.6, delay: 0.3 }"
          class="flex flex-wrap gap-4 pt-2"
        >
          <a
            href="#tool"
            class="inline-flex items-center justify-center px-6 py-3 rounded-full bg-white text-gray-900 font-semibold text-sm shadow-md hover:bg-gray-100 transition-colors duration-200"
          >
            {{ prefix + '.cta.primary' | translate }}
          </a>

          <a
            href="#learn-more"
            class="inline-flex items-center gap-1.5 font-semibold text-sm transition-colors duration-200"
            [ngClass]="accent"
          >
            {{ prefix + '.cta.secondary' | translate }}
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        </div>
      </div>

      <figure
        ngmMotion
        [initial]="{ opacity: 0, x: 40 }"
        [whileInView]="{ opacity: 1, x: 0 }"
        [viewport]="{ once: true, amount: 0.3 }"
        [transition]="{ duration: 0.7, delay: 0.2 }"
        class="lg:col-span-3 flex justify-center lg:justify-end"
      >
        <img
          [src]="data.imageSrc"
          [alt]="data.imageAlt"
          [attr.width]="data.imageWidth ?? 1000"
          [attr.height]="data.imageHeight ?? 642"
          class="w-full h-full max-w-sm lg:max-w-96 object-cover drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] dark:drop-shadow-[0_10px_20px_rgba(255,255,255,0.3)]"
          loading="eager"
        />
      </figure>
    </div>
  </div>
</section>
