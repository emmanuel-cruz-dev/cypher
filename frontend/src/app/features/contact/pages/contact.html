<main class="relative dark:bg-[#0d1117] min-h-screen py-20 px-6 overflow-hidden">
  <div class="absolute inset-0 pointer-events-none">
    <svg
      class="w-full h-full opacity-10 text-black dark:text-white"
      xmlns="http://www.w3.org/2000/svg"
    >
      <line x1="20%" y1="0%" x2="0%" y2="60%" class="stroke-current" stroke-width="0.5" />
      <line x1="80%" y1="0%" x2="100%" y2="60%" class="stroke-current" stroke-width="0.5" />
    </svg>
  </div>

  <div class="relative z-10 max-w-6xl mx-auto flex flex-col gap-12">
    <header class="text-center flex flex-col gap-3">
      <p
        ngmMotion
        [initial]="{ opacity: 0, y: -12 }"
        [whileInView]="{ opacity: 1, y: 0 }"
        [viewport]="{ once: true }"
        [transition]="{ duration: 0.6 }"
        class="text-sm font-semibold tracking-[0.2em] text-gray-400 uppercase"
      >
        {{ 'contact.tagline' | translate }}
      </p>
      <h1
        ngmMotion
        [initial]="{ opacity: 0, y: 20 }"
        [whileInView]="{ opacity: 1, y: 0 }"
        [viewport]="{ once: true }"
        [transition]="{ duration: 0.6, delay: 0.1 }"
        class="text-4xl md:text-5xl font-bold leading-tight"
      >
        {{ 'contact.title' | translate }}
      </h1>
      <p
        ngmMotion
        [initial]="{ opacity: 0, y: 16 }"
        [whileInView]="{ opacity: 1, y: 0 }"
        [viewport]="{ once: true }"
        [transition]="{ duration: 0.6, delay: 0.2 }"
        class="text-base text-gray-500 dark:text-gray-400"
      >
        {{ 'contact.subtitle' | translate }}
      </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <app-contact-information
        ngmMotion
        [initial]="{ opacity: 0, x: -40 }"
        [whileInView]="{ opacity: 1, x: 0 }"
        [viewport]="{ once: true, amount: 0.3 }"
        [transition]="{ duration: 0.7, delay: 0.2 }"
      />
      <app-contact-form
        class="lg:col-span-2"
        ngmMotion
        [initial]="{ opacity: 0, x: 40 }"
        [whileInView]="{ opacity: 1, x: 0 }"
        [viewport]="{ once: true, amount: 0.3 }"
        [transition]="{ duration: 0.7, delay: 0.2 }"
      />
    </div>
  </div>
</main>
