<ul class="flex items-center gap-3">
  @for (social of socials; track social.route) {
  <li>
    <a
      [href]="social.route"
      matTooltip="{{ social.labelKey }}"
      class="darK:text-gray-500 hover:text-{{ social.color }} transition-colors"
      target="_blank"
      rel="noopener noreferrer"
    >
      <mat-icon svgIcon="{{ social.icon }}" class="w-5! h-5!"></mat-icon>
    </a>
  </li>
  }
</ul>
